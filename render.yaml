# Plan Render : l'application HotelManagment + sa base PostgreSQL.
# Sur render.com : New > Blueprint > choisir le dépôt GitHub du projet.
#
# Construction avec le Dockerfile : les PDF (xhtml2pdf > svglib > pycairo) ont besoin
# de bibliothèques système que l'environnement Python de Render ne fournit pas.
databases:
  - name: hotelmanagment-db
    plan: free
    databaseName: hotelmanagment
    user: hotelmanagment

services:
  - type: web
    name: hotelmanagment
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hotelmanagment-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 2
