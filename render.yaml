# Plan Render : l'application HotelManagment + sa base PostgreSQL.
# Sur render.com : New > Blueprint > choisir le dépôt GitHub du projet.
databases:
  - name: hotelmanagment-db
    plan: free
    databaseName: hotelmanagment
    user: hotelmanagment

services:
  - type: web
    name: hotelmanagment
    runtime: python
    plan: free
    # build.sh : dépendances, fichiers CSS/JS, mise à jour de la base
    buildCommand: bash build.sh
    startCommand: gunicorn prohotel.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --access-logfile -
    envVars:
      # Python 3.14 n'a pas encore de paquet prêt pour python-bidi (PDF)
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: hotelmanagment-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 2
