# HotelManagment sur un VPS : application + HTTPS automatique.
# La base est celle indiquée par DATABASE_URL dans le fichier .env (Neon, Supabase...).
#
#   docker compose up -d --build
#
# Pour héberger aussi PostgreSQL sur le serveur, ajoutez le second fichier :
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build

services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DOMAINE}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAINE}
      DJANGO_USE_X_FORWARDED: "True"
      DJANGO_SECURE_COOKIES: "True"
      DJANGO_MEDIA_ROOT: /app/media
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL_REQUIRE: ${DB_SSL_REQUIRE:-True}
    volumes:
      - media_data:/app/media
    expose:
      - "8080"

  # Certificat HTTPS obtenu et renouvelé automatiquement
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINE: ${DOMAINE}
      EMAIL_ADMIN: ${EMAIL_ADMIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  media_data:
  caddy_data:
  caddy_config:
