<div class="card">
  <div class="card-body d-flex justify-content-between">
    <div>
      <div class="fw-semibold">{{ e.categorie }}</div>
      <div class="text-muted small">{{ e.description|truncatechars:60 }}</div>
    </div>
    <div class="text-end">
      <div class="fw-semibold">{{ e.montant }}</div>
      <div class="small text-muted">{{ e.date_depense }}</div>
    </div>
  </div>
</div>
