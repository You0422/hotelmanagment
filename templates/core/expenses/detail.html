{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4">Dépense: {{ expense.categorie }}</h1>
  <div>
    <a class="btn btn-secondary me-2" href="{% url 'expenses_update' expense.id %}">Modifier</a>
    <a class="btn btn-danger" href="{% url 'expenses_delete' expense.id %}">Supprimer</a>
  </div>
</div>

<div class="card p-3" style="max-width:720px;">
  <div><strong>Montant:</strong> {{ expense.montant }}</div>
  <div><strong>Date:</strong> {{ expense.date_depense }}</div>
  <div class="mt-2">{{ expense.description|default:'—' }}</div>
  <div class="mt-3">
    <a class="btn btn-outline-secondary" href="{% url 'expenses_list' %}">Retour</a>
  </div>
</div>

{% endblock %}
